version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cricketgpt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cricketgpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cricketgpt-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricketgpt-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cricketgpt
      - USE_SQLITE=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - SECRET_KEY=cricketgpt_super_secret_production_key
      # Add API keys here if you run in production:
      # - OPENAI_API_KEY=yourkey
      # - GEMINI_API_KEY=yourkey
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - chromadata:/app/chroma_db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricketgpt-web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  chromadata:
